[custom]
lib_deps =
  ArduinoJson=https://github.com/bblanchon/ArduinoJson/releases/download/v6.21.2/ArduinoJson-v6.21.2.zip
build_flags =
  ${KNX_TP.build_flags}

[custom_develop]
extends = custom
build_flags =
  ${custom.build_flags}
  -D OPENKNX_HEARTBEAT
  -D OPENKNX_RUNTIME_STAT
  -D OPENKNX_LOOPTIME_WARNING=100
debug_build_flags = -ggdb3

[custom_releases]
extends = custom
build_flags =
  ${custom.build_flags}
  -D OPENKNX_WATCHDOG
  -D OPENKNX_LOOPTIME_WARNING=20

[RP2040_custom]
extends = RP2040, RP2040_16MB, custom
board_build.filesystem_size = 15314944
build_flags =
  -D SERIAL_DEBUG=Serial
  -D USE_KNX_DMA_UART=0
  -D USE_KNX_DMA_IRQ=0
  -D MAX_TX_QUEUE=100
  -Wunused-variable

[RP2040_custom_develop]
extends = RP2040_develop, RP2040_custom, custom_develop
build_flags =
  ${RP2040_develop.build_flags}
  ${RP2040_custom.build_flags}
  ${custom_develop.build_flags}
debug_build_flags =
  ${custom_develop.debug_build_flags}
  -O0

[RP2040_custom_releases]
extends = RP2040_releases, RP2040_custom, custom_releases
build_flags =
  ${RP2040_releases.build_flags}
  ${RP2040_custom.build_flags}
  ${custom_releases.build_flags}

[upload_USB_RP2040]
extends = RP2040_custom_develop, RP2040_UPLOAD_USB

[env:develop_OAM_DigitalLEDController]
extends = RP2040_custom_develop, RP2040_16MB, upload_USB_RP2040
upload_protocol = mbed
build_flags =
  ${RP2040_custom_develop.build_flags}
  -D BOARD_OAM_DIGITAL_LED_CONTROLLER

[env:release_OAM_DigitalLEDController]
extends = RP2040_custom_releases
build_flags =
  ${RP2040_custom_releases.build_flags}
  -D BOARD_OAM_DIGITAL_LED_CONTROLLER
